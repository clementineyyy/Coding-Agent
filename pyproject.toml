[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name =     "nju-coding-agent-harness"
version = "0.2.7"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "requests",
    "mcp",
    "keyring",
    "httpx",
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
cah = "harness.main:main"

[tool.setuptools.package-data]
harness = ["webui/static/*"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
addopts = "-q"
