name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest harness/tests/test_llm.py -q
      - run: pytest harness/tests/test_agent_core.py -q
      - run: pytest harness/tests/test_agent_context.py -q
      - run: pytest harness/tests/test_agent_feedback.py -q
      - run: pytest harness/tests/test_agent_end.py -q
      - run: pytest harness/tests/test_task_executor.py -q
      - run: pytest harness/tests/webui/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
